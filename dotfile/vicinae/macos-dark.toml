# Nord - Arctic Dark
# Arctic, north-bluish clean and elegant theme

[meta]
version = 1
name = "MacOS"
description = "Clear, macos themes"                         
variant = "dark"
icon = "icons/macos.png"

[colors.core]
background = "#1E1E1E"              # macOS dark window background
foreground = "#F5F5F7"              # primary text
secondary_background = "#2C2C2E"    # elevated / secondary surface
border = "#3A3A3C"                  # subtle border
accent = "#0A84FF"                  # macOS system blue

[colors.accents]
blue = "#0A84FF"                    # system blue
green = "#30D158"                   # system green
magenta = "#BF5AF2"                 # system purple/magenta
orange = "#FF9F0A"                  # system orange
purple = "#BF5AF2"                  # system purple
red = "#FF453A"                     # system red
yellow = "#FFD60A"                  # system yellow
cyan = "#64D2FF"                    # system cyan

[colors.list.item.selection]
background = "#3A3A3C"
secondary_background = "#48484A"

[colors.grid.item]
background = "#2C2C2E"
