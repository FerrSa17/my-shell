general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

# ---- Фон: размытые текущие обои ----
background {
    monitor =
    path = /home/user/Wallpaper/M3-MacBook-Pro-Wallpaper-8K.png
    #blur_passes = 3
    #blur_size = 8
    #noise = 0.0117
    #contrast = 0.9
    #brightness = 0.6
    #vibrancy = 0.2
    #vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ffffffee)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 400
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=en_US.UTF-8 date +"%A, %d %B")"
    color = rgba(ffffffcc)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 320
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(ffffffee)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -340
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(ffffff55)
    inner_color = rgba(30303080)
    font_color = rgba(ffffffee)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    hide_input = false
    rounding = 26 
    check_color = rgba(a8cc8caa)
    fail_color = rgba(cc6666cc)
    fail_text = Faled Password
    position = 0, -400
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = Type your password and press Enter 
    color = rgba(ffffff88)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -460
    halign = center
    valign = center
}
